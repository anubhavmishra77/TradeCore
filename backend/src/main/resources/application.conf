ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.tradecore.backend.ApplicationKt.module ]
    }
}

database {
    url      = "jdbc:postgresql://localhost:5432/tradecore"
    url      = ${?DATABASE_URL}
    user     = "tradecore"
    user     = ${?DATABASE_USER}
    password = "tradecore"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}

redis {
    host = "localhost"
    host = ${?REDIS_HOST}
    port = 6379
}

jwt {
    secret          = "change-me-in-production"
    secret          = ${?JWT_SECRET}
    issuer          = "tradecore"
    audience        = "tradecore-app"
    realm           = "tradecore"
    accessTtlMinutes  = 15
    refreshTtlDays    = 30
}

trading {
    idempotencyTtlMinutes = 60
    maxOpenOrdersPerUser  = 50
}
