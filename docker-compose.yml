version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradecore-postgres
    environment:
      POSTGRES_USER: tradecore
      POSTGRES_PASSWORD: tradecore
      POSTGRES_DB: tradecore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradecore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tradecore-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: tradecore-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tradecore
      DATABASE_USER: tradecore
      DATABASE_PASSWORD: tradecore
      REDIS_HOST: redis
      JWT_SECRET: change-me-in-production
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: tradecore-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres-data:
